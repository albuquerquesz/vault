name: Deploy API

on:
  # Production deploy of the vault-api Cloudflare Worker on every push to main.
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - ".github/workflows/deploy-api.yml"
      - "package.json"
      - "bun.lock"
  # Manual production deploy when needed.
  workflow_dispatch:

concurrency:
  group: deploy-api-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Cloudflare secrets
        run: |
          missing=0
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!key}" ]; then
              echo "::error::$key secret is empty or not configured."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Set secrets under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deploy worker
        # Code only: secrets already on the Worker are kept (see scripts/cf-deploy.ts).
        working-directory: apps/api
        run: bunx wrangler@4.156.0 deploy --var CF_WORKER:1

      - name: Smoke-test webhook endpoint
        run: |
          set -euo pipefail
          base="https://vault-api.albuquerquesz.com"
          code=$(curl -sS -o /tmp/wh.json -w "%{http_code}" -X POST \
            "$base/api/webhooks/pluggy" \
            -H 'content-type: application/json' \
            -d '{"event":"item/updated","itemId":"00000000-0000-0000-0000-000000000000","eventId":"ci-smoke"}')
          body=$(cat /tmp/wh.json)
          echo "HTTP $code $body"
          test "$code" = "200"
          echo "$body" | grep -q '"handled"'

      - name: Smoke-test Google OAuth
        # Google answers invalid_client when GOOGLE_CLIENT_ID is wrong on the Worker.
        run: |
          set -euo pipefail
          web="https://vault.albuquerquesz.com"
          url=$(curl -sS -X POST "$web/api/auth/sign-in/social" \
            -H 'content-type: application/json' \
            -H "origin: $web" \
            -d '{"provider":"google"}' | jq -r '.url')
          echo "$url" | grep -qE 'client_id=[0-9]+-[a-z0-9]+\.apps\.googleusercontent\.com'
          final=$(curl -sS -L -o /tmp/google.html -w "%{url_effective}" -A 'Mozilla/5.0' "$url")
          echo "Google landed on: ${final%%\?*}"
          if grep -qiE 'invalid_client|redirect_uri_mismatch' /tmp/google.html; then
            echo "::error::Google rejected the OAuth client or redirect URI."
            exit 1
          fi
