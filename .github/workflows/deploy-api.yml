name: Deploy API

on:
  # Production only when a PR is merged into main (not on every push / not on dev).
  pull_request:
    types: [closed]
    branches:
      - main
    paths:
      - "apps/api/**"
      - "packages/api/**"
      - ".github/workflows/deploy-api.yml"
      - "package.json"
      - "bun.lock"
      - "turbo.json"
  # Manual production deploy when needed.
  workflow_dispatch:

concurrency:
  group: deploy-api-production
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_API }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # After a merged PR, deploy the merge commit on main.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Verify Vercel secrets
        run: |
          missing=0
          for key in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!key}" ]; then
              echo "::error::$key secret is empty or not configured."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Set secrets under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install Vercel CLI
        run: bun add -g vercel@latest

      - name: Pull Vercel project settings
        # Must run from monorepo root so Root Directory apps/api resolves correctly.
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build project artifacts
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to production
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url"

      - name: Smoke-test webhook endpoint
        run: |
          set -euo pipefail
          base="https://vault-api.albuquerquesz.com"
          # Production alias should always be the stable webhook URL.
          code=$(curl -sS -o /tmp/wh.json -w "%{http_code}" -X POST \
            "$base/api/webhooks/pluggy" \
            -H 'content-type: application/json' \
            -d '{"event":"item/updated","itemId":"00000000-0000-0000-0000-000000000000","eventId":"ci-smoke"}')
          body=$(cat /tmp/wh.json)
          echo "HTTP $code $body"
          test "$code" = "200"
          echo "$body" | grep -q '"handled"'
